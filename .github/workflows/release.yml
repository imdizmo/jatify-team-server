# A tag v<VERSION> (with its section in CHANGELOG.md) builds the team server for linux-x64, linux-arm64 and win-x64
# from the pinned services, and publishes them with SHA256SUMS, services.json and a compose.yaml pinned to this
# release's images, and the two images (amd64, arm64). A run by hand only builds.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      shelf: ${{ steps.v.outputs.shelf }}
      questlog: ${{ steps.v.outputs.questlog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true   # services/ only; their own submodules are not needed
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          package_json_file: services/questlog/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: services/questlog/scripts/node-version.txt
      - name: Versions and notes
        id: v
        run: |
          v=$(cat VERSION)
          shelf=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' services/asset-shelf/server/ShelfServer/ShelfServer.csproj)
          questlog=$(node -p "require('./services/questlog/package.json').version")
          { echo "version=$v"; echo "shelf=$shelf"; echo "questlog=$questlog"; } >> "$GITHUB_OUTPUT"
          awk -v h="## [$v]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$v" ]] || { echo "::error::tag $GITHUB_REF_NAME is not v$v (VERSION)"; exit 1; }
            [[ -n "$(tr -d '[:space:]' < notes.md)" ]] || { echo "::error::CHANGELOG.md has no section ## [$v]"; exit 1; }
          fi
          printf '\nContains Questlog server %s and ShelfServer %s.\n' "$questlog" "$shelf" >> notes.md
      - name: Build for each system
        run: |
          for rid in linux-x64 linux-arm64 win-x64; do scripts/build.sh "$rid" dist; done
          scripts/services.sh "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.shelf }}" "${{ steps.v.outputs.questlog }}" > dist/services.json
          scripts/compose.sh "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.shelf }}" "${{ steps.v.outputs.questlog }}" > dist/compose.yaml
          scripts/compose.sh --host-tailscale "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.shelf }}" "${{ steps.v.outputs.questlog }}" > dist/compose-host-tailscale.yaml
          (cd dist && sha256sum jatify-team-server-*.tar.gz jatify-team-server-*.zip services.json compose.yaml compose-host-tailscale.yaml > SHA256SUMS && cat SHA256SUMS)
          mv notes.md dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: team-server
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/services.json
            dist/compose.yaml
            dist/compose-host-tailscale.yaml
            dist/SHA256SUMS
            dist/notes.md
          retention-days: 14

  images:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: shelf-server
            context: services/asset-shelf
            file: services/asset-shelf/server/Dockerfile
            version: shelf
          - name: questlog-server
            context: services/questlog
            file: services/questlog/Dockerfile
            version: questlog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ needs.build.outputs[matrix.version] }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: team-server
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/services.json dist/compose.yaml dist/compose-host-tailscale.yaml dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Jatify team server ${{ needs.build.outputs.version }}" --notes-file dist/notes.md
